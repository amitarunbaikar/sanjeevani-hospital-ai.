   "touch glow" that follows the pointer. Pressing makes the glass swell with a springy bounce. */
:root,[data-theme=dark],.login-box{
  --lg-rim:linear-gradient(135deg,rgba(255,255,255,.92) 0%,rgba(255,255,255,.14) 24%,rgba(255,255,255,.04) 56%,rgba(255,255,255,.55) 100%);
  --lg-sheen:linear-gradient(180deg,rgba(255,255,255,.26) 0%,rgba(255,255,255,.05) 40%,rgba(255,255,255,0) 70%);
  --lg-clear:rgba(255,255,255,.09);--lg-clear-hi:rgba(255,255,255,.18);
  --lg-tint:rgba(10,150,145,.82);--lg-danger:rgba(220,50,50,.78);--lg-glow:rgba(25,227,211,.5);
  --lg-inset:inset 0 1px 1px rgba(255,255,255,.5),inset 0 -1px 1px rgba(255,255,255,.14),inset 0 0 16px rgba(255,255,255,.07);
  --lg-drop:0 10px 24px -10px rgba(0,0,0,.65),0 2px 5px rgba(0,0,0,.28);
  --lg-bar:rgba(18,32,50,.5);--lg-chip:rgba(25,195,184,.3);--lg-active-ink:#8af5ec;
  --lg-blur:blur(16px) saturate(190%) brightness(1.1);
}
[data-theme=light]{
  --lg-rim:linear-gradient(135deg,#fff 0%,rgba(255,255,255,.4) 24%,rgba(13,42,67,.12) 58%,rgba(255,255,255,.95) 100%);
  --lg-sheen:linear-gradient(180deg,rgba(255,255,255,.2) 0%,rgba(255,255,255,.04) 40%,rgba(255,255,255,0) 70%);
  --lg-clear:rgba(255,255,255,.55);--lg-clear-hi:rgba(255,255,255,.9);
  --lg-tint:rgba(8,120,117,.9);--lg-danger:rgba(180,40,40,.9);--lg-glow:rgba(15,159,154,.42);
  --lg-inset:inset 0 1px 1px rgba(255,255,255,.95),inset 0 -1px 1px rgba(255,255,255,.55),inset 0 0 14px rgba(255,255,255,.3);
  --lg-drop:0 10px 22px -10px rgba(16,42,67,.35),0 2px 5px rgba(16,42,67,.12);
  --lg-bar:rgba(255,255,255,.55);--lg-chip:rgba(15,159,154,.2);--lg-active-ink:#08706c;
}

/* ---- base glass button (primary = tinted glass) ---- */
button{
  position:relative;isolation:isolate;overflow:visible;border:0;border-radius:999px;padding:10px 20px;
  font-weight:600;letter-spacing:.005em;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.25);
  background:var(--lg-sheen),var(--lg-tint);
  -webkit-backdrop-filter:var(--lg-blur);backdrop-filter:var(--lg-blur);
  box-shadow:var(--lg-inset),var(--lg-drop),0 8px 22px -8px var(--lg-glow);
  filter:none;
  transition:transform .5s cubic-bezier(.34,1.56,.64,1),box-shadow .3s ease,background .3s ease;
}
/* touch glow that follows the pointer (position set by the small script at the bottom) */
button::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;
  background:radial-gradient(110px circle at var(--bx,50%) var(--by,0%),rgba(255,255,255,.6),rgba(255,255,255,.15) 45%,transparent 72%);
  opacity:0;transition:opacity .35s ease}
/* specular rim: bright where light hits (top-left, bottom-right), nearly invisible elsewhere */
button::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:var(--lg-rim);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);mask-composite:exclude;
  opacity:.95;transition:opacity .3s}
button:focus-visible::before{opacity:.8}
button:active{transform:scale(1.06);box-shadow:var(--lg-inset),var(--lg-drop),0 14px 30px -8px var(--lg-glow)}
button:active::before{opacity:1}
button:disabled{opacity:.5;cursor:not-allowed;transform:none}
@media(hover:hover){
  button:hover{filter:none;transform:translateY(-1px) scale(1.03);box-shadow:var(--lg-inset),var(--lg-drop),0 14px 30px -8px var(--lg-glow)}
  button:hover::before{opacity:1}
  button:active:hover{transform:scale(1.06)}
}
.rip,button .rip{display:none!important}

/* ---- secondary / ghost = clear glass ---- */
button.secondary,button.ghost{
  --lg-glow:transparent;color:var(--navy);text-shadow:none;border:0;
  background:var(--lg-sheen),var(--lg-clear);
  box-shadow:var(--lg-inset),var(--lg-drop);
}
button.secondary:hover,button.ghost:hover{box-shadow:var(--lg-inset),var(--lg-drop)}
button.secondary:active,button.ghost:active{box-shadow:var(--lg-inset),var(--lg-drop)}
/* ---- danger = red-tinted glass ---- */
button.danger{--lg-glow:rgba(239,68,68,.55);background:var(--lg-sheen),var(--lg-danger)}
button.small{padding:6px 14px;font-size:12px}

/* round icon-style glass buttons in the top bar / login */
.themeBtn,.top-actions .ghost{width:40px;height:40px;padding:0;display:inline-grid;place-items:center;font-size:17px}
.notification-btn{overflow:visible}
.notification-btn span{text-shadow:none;color:#fff;z-index:2}
.eye{border-radius:999px}
.demo-grid button{border-radius:22px}

/* link-style button stays a plain text link */
.linkbtn{-webkit-backdrop-filter:none;backdrop-filter:none;text-shadow:none;border-radius:6px}
.linkbtn::before,.linkbtn::after{display:none}
.linkbtn:hover,.linkbtn:active{transform:none;box-shadow:none}

/* ---- sidebar: items are bare until selected, then become a glass capsule ---- */
.nav button{border-radius:18px;padding:10px 14px;background:transparent;color:#c8d8e5;font-weight:550;text-shadow:none;box-shadow:none;
  -webkit-backdrop-filter:none;backdrop-filter:none;
  transition:background .3s,color .3s,box-shadow .3s,transform .5s cubic-bezier(.34,1.56,.64,1)}
.nav button::before{background:radial-gradient(130px circle at var(--bx,50%) var(--by,50%),rgba(255,255,255,.2),transparent 70%)}
.nav button::after{opacity:0}
.nav button:hover{background:rgba(255,255,255,.08);color:#fff;transform:none;box-shadow:none}
.nav button:active{transform:scale(1.03);background:rgba(255,255,255,.13)}
.nav button.active{
  background:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,.04) 55%),rgba(25,195,184,.32);color:#fff;
  -webkit-backdrop-filter:blur(14px) saturate(180%);backdrop-filter:blur(14px) saturate(180%);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.55),inset 0 -1px 1px rgba(255,255,255,.14),inset 0 0 18px rgba(255,255,255,.08),0 10px 24px -10px rgba(25,227,211,.6)}
.nav button.active::after{opacity:1}

/* ---- sidebar hover: label pops slightly in place ---- */
.nav button .nav-txt,.nav button .nav-ico{display:inline-block;transition:transform .35s cubic-bezier(.34,1.56,.64,1),text-shadow .3s,opacity .3s;will-change:transform}
.nav button .nav-txt{transform-origin:left center}
.nav button:hover .nav-txt{transform:scale(1.07) translateX(3px);text-shadow:0 2px 10px rgba(25,227,211,.45)}
.nav button:hover .nav-ico{transform:scale(1.15)}
.nav button:active .nav-txt{transform:scale(1.03) translateX(1px)}

/* ---- phone: floating glass tab bar with a glass chip on the selected tab ---- */
@media(max-width:760px){
  .content{padding-bottom:115px}
  .bottom-nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:6px;gap:2px;border:0;border-radius:32px;
    background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.02)),var(--lg-bar);
    -webkit-backdrop-filter:blur(24px) saturate(200%) brightness(1.08);backdrop-filter:blur(24px) saturate(200%) brightness(1.08);
    box-shadow:var(--lg-inset),0 18px 40px -12px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.2)}
  .bottom-nav::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;background:var(--lg-rim);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);mask-composite:exclude}
  .bottom-nav button{border-radius:26px;padding:7px 4px;color:var(--muted);background:transparent;font-weight:600;text-shadow:none;
    -webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none}
  .bottom-nav button::after{opacity:0}
  .bottom-nav button:hover{transform:none;box-shadow:none}
  .bottom-nav button:active{transform:scale(1.06)}
  .bottom-nav button.active{color:var(--lg-active-ink);background:var(--lg-sheen),var(--lg-chip);
    -webkit-backdrop-filter:blur(12px) saturate(180%);backdrop-filter:blur(12px) saturate(180%);box-shadow:var(--lg-inset)}
  .bottom-nav button.active::after{opacity:1}
}

/* ---- accessibility / fallback: honour "Reduce transparency" and browsers without backdrop-filter ---- */
@media(prefers-reduced-transparency:reduce){
  button,.nav button.active,.bottom-nav,.bottom-nav button.active{-webkit-backdrop-filter:none;backdrop-filter:none}
  button{background:var(--lg-tint)}button.secondary,button.ghost{background:var(--lg-clear-hi)}button.danger{background:var(--lg-danger)}
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  button{background:var(--lg-sheen),var(--lg-tint)}
}
</style>

var RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var T=document.getElementById('bootTitle');'SANJEEVANI'.split('').forEach(function(c,i){var s=document.createElement('span');s.textContent=c;s.style.animationDelay=(.25+i*.07)+'s';T.appendChild(s)});

var fill=document.getElementById('bootFill'),pct=document.getElementById('bootPct'),msg=document.getElementById('bootMsg'),bpm=document.getElementById('bootBpm');
var DUR=RM?300:3600,t0=performance.now(),last=-1;
function ease(x){return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2}
function tick(now){var x=Math.min(1,(now-t0)/DUR),p=Math.round(ease(x)*100);
 if(p!==last){last=p;fill.style.width=p+'%';pct.textContent=p+'%';for(var i=msgs.length-1;i>=0;i--){if(p>=msgs[i][0]){msg.textContent=msgs[i][1];break}}}
 if(Math.random()<.08)bpm.textContent=70+Math.floor(Math.random()*8);
 if(x<1)requestAnimationFrame(tick);else{setTimeout(function(){b.classList.add('done');setTimeout(function(){b.remove();var s=document.getElementById('boot-css');if(s)s.remove()},1300)},RM?0:350)}}
requestAnimationFrame(tick);
})();
</script>

function render(){if(!db.user){shell();return}save();document.getElementById("app").innerHTML=`<div class="layout"><aside class="sidebar"><div class="brand"><div class="brand-mark">✚</div><div><strong>Sanjeevani Hospital AI</strong><small>The Blocked Bed</small></div></div><div class="nav-label">Workspace</div><nav class="nav" id="sideNav">${NAV.map(([key,icon,label])=>{let restricted=(key==="reviews"||key==="superai")&&!userIsSuper();return `<button data-page="${key}" class="${db.active===key?"active":""} ${restricted?"hidden":""}"><span class="nav-ico" style="width:18px;text-align:center">${icon}</span><span class="nav-txt">${label}</span></button>`}).join("")}</nav><div class="sidebar-bottom"><b>● Demo environment</b><br>Browser-local data<br><span style="opacity:.7">Not connected to live hospital systems</span></div></aside><main class="main"><header class="topbar"><div class="top-left"><div><div class="eyebrow">SANJEEVANI OPERATIONS / ${esc(db.user.role.toUpperCase())}</div><strong id="topTitle">Hospital Overview</strong></div></div><div class="top-actions"><button class="ghost notification-btn" id="notifyBtn" title="Notifications">♧ <span>${countUnread()}</span></button><div class="avatar">${esc(db.user.name.slice(0,1).toUpperCase())}</div><div class="role-label"><strong style="font-size:12px">${esc(db.user.name)}</strong><div class="muted smalltext">${esc(db.user.staffId)}</div></div><button class="secondary small" id="logoutBtn">Logout</button></div></header><div class="content" id="content"></div><nav class="bottom-nav">${[["overview","▦","Home"],["department","▣","My Dept"],["actions","✓","Actions"],["insights","✧","Insights"],["updates","◷","Updates"]].map(([k,i,l])=>`<button data-page="${k}" class="${db.active===k?"active":""}"><span>${i}</span>${l}</button>`).join("")}</nav></main></div>`;
document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>go(b.dataset.page));
document.getElementById("logoutBtn").onclick=()=>{db.user=null;save();render()};
document.getElementById("notifyBtn").onclick=()=>{db.active="updates";db.notifications.forEach(n=>n.read=true);save();render()};
renderPage()}
function go(page){if((page==="reviews"||page==="superai")&&!userIsSuper()){toast("Only the Medical Superintendent can review reports.","error");return}if(window.__pgLoad&&db.active!==page){document.querySelectorAll(".nav button,.bottom-nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));window.__pgLoad(page,()=>{db.active=page;render()});return}db.active=page;render()}
function titleFor(p){return (NAV.find(x=>x[0]===p)||[])[2]||"Hospital Overview"}
function pageTitle(title,sub,extra=""){return `<div class="page-title"><div><h1>${title}</h1><p>${sub}</p></div>${extra}</div>`}
function metric(label,value,icon,detail="",pct=null){return `<div class="card"><div class="metric"><div><div class="label">${label}</div><div class="value">${value}</div>${detail?`<div class="muted smalltext">${detail}</div>`:""}</div><div class="icon">${icon}</div></div>${pct!==null?`<div class="progress"><span style="width:${Math.min(100,Math.max(0,pct))}%"></span></div>`:""}</div>`}
function table(headers,rows,empty="No records yet."){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.length?rows.join(""):`<tr><td colspan="${headers.length}"><div class="empty">${empty}</div></td></tr>`}</tbody></table></div>`}
function eventList(){return db.events.slice(0,7).map(e=>`<div class="notice ${e.priority==="Critical"||e.priority==="High"?"critical":""}"><div style="display:flex;justify-content:space-between;gap:10px"><b>${esc(e.text)}</b>${statusTag(e.priority)}</div><div class="muted smalltext">${esc(e.department)} · ${dt(e.time)}</div></div>`).join("")||`<div class="empty">No updates submitted yet.</div>`}
function renderPage(){let c=document.getElementById("content");document.getElementById("topTitle").textContent=titleFor(db.active);let html="";
switch(db.active){
case"overview":html=overview();break;case"department":html=department();break;case"updates":html=updates();break;case"beds":html=bedsPage();break;case"doctors":html=doctorsPage();break;case"labs":html=labsPage();break;case"discharges":html=dischargesPage();break;case"staff":html=staffPage();break;case"complaints":html=complaintsPage();break;case"transfers":html=transfersPage();break;case"inventory":html=inventoryPage();break;case"insights":html=insightsPage();break;case"actions":html=actionsPage();break;case"reports":html=reportsPage();break;case"reviews":html=reviewsPage();break;case"superai":html=superAiPage();break;case"accounts":html=accountsPage();break;default:html=overview()}
html=addonsInject(html,db.active);
if(db.active!=="accounts")html += contextualAgentPanel(db.active);
c.innerHTML=html;wirePage();ensureMonitorPill();if(db.active==="accounts")wireAccounts()}
function overview(){autoActions();let b=db.beds,waiting=db.doctors.reduce((s,d)=>s+n(d.waiting),0),ins=insights();return `${pageTitle("Hospital Overview","A live summary of entered operational data across Sanjeevani departments.",`<button id="quickReport">＋ Submit report</button>`)}<div class="role-note">Signed in as <b>${esc(db.user.role)}</b>. ${userIsSuper()?"You have cross-department visibility and report-review controls.":"You can view hospital-wide information; editing is available in your department workspace."}</div><div class="grid four">${metric("Total beds",b.total,"▤","Registered demo capacity")}${metric("Emergency beds",25,"🚑","Reserved emergency capacity",b.total?25/b.total*100:0)}${metric("Occupied beds",b.occupied,"▰",`${Math.round(b.occupied/Math.max(1,b.total)*100)}% of total`,b.occupied/Math.max(1,b.total)*100)}${metric("Blocked beds",b.blocked,"⚠",b.reason)}<div class="card" style="display:flex;flex-direction:column;justify-content:center;gap:8px"><b>Investigate blocked beds</b><span class="muted smalltext">Open bed-by-bed root-cause report</span><button class="small" data-page="beds">Investigate ${b.blocked} blocked beds →</button></div></div><div class="grid four" style="margin-top:16px">${metric("Doctors available",db.doctors.filter(d=>d.status==="Available").length,"✚","of "+db.doctors.length+" listed")}${metric("Appointment slots",slots(),"◷","Based on entered doctor slots")}${metric("Pending discharges",pendingDischarges(),"⇥","Not finally approved")}${metric("Delayed lab tests",delayedLabs(),"⚗","Across listed investigations")}</div>${attentionStrip()}${agentPanels()}<div class="grid two" style="margin-top:16px"><div class="card"><h3>Critical operational alerts</h3>${ins.filter(x=>["Critical","High"].includes(x.priority)).slice(0,4).map(x=>`<div class="notice ${x.priority==="Critical"?"critical":"warn"}"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(x.issue)}</b>${statusTag(x.priority)}</div><div class="muted smalltext">${esc(x.departments)}</div><p class="smalltext">${esc(x.action)}</p></div>`).join("")||`<div class="empty">No high-priority alerts from current rules.</div>`}<button class="secondary small" data-page="insights">View all insights →</button></div><div class="card"><h3>Recent department updates</h3>${eventList()}<button class="secondary small" data-page="updates">All updates →</button></div></div><div class="grid two" style="margin-top:16px"><div class="card"><h3>Department snapshot</h3>${[["Bed Management",`${b.blocked} blocked beds`,b.blocked?"red":"green"],["Appointments and Doctors",`${slots()} available slots`,slots()?"green":"amber"],["Diagnostics and Laboratories",`${delayedLabs()} delayed tests`,delayedLabs()?"red":"green"],["Discharge Coordination",`${pendingDischarges()} pending discharges`,pendingDischarges()?"amber":"green"],["Staff and Rosters",`${shortages()} staff shortages`,shortages()?"red":"green"],["Complaints and Feedback",`${db.complaints.filter(x=>x.status!=="Resolved").length} unresolved complaints`,"amber"]].map(x=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #edf1f5"><span>${x[0]}</span><span class="tag ${x[2]}">${x[1]}</span></div>`).join("")}</div><div class="card"><h3>Open action queue</h3>${db.actions.filter(a=>a.status!=="Completed").slice(0,5).map(a=>`<div class="notice"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(a.title)}</b>${statusTag(a.priority)}</div><div class="muted smalltext">${esc(a.department)} · ${statusTag(a.status)}</div></div>`).join("")||`<div class="empty">No open actions.</div>`}<button class="secondary small" data-page="actions">Manage actions →</button></div></div>`}
function department(){let r=db.user.role;let mapping={"Bed Management":"beds","Appointments and Doctors":"doctors","Diagnostics and Laboratories":"labs","Discharge Coordination":"discharges","Nursing and Ward Management":"beds","Staff and Rosters":"staff","Pharmacy and Inventory":"inventory","Oxygen and Medical Supplies":"inventory","Patient Transfer Coordinator":"transfers","Complaints and Feedback":"complaints","Administration":"reports","Hospital Superintendent":"reviews","Medical Superintendent":"reviews"};let p=mapping[r];return `${pageTitle("My Department",`Workspace for ${r}. Your submitted changes are reflected in the shared dashboard.`)}<div class="grid two"><div class="card"><h3>Your workspace</h3><p>${userIsSuper()?"Review reports and monitor every department.":"Enter and maintain operational data for your department."}</p><p class="muted smalltext">Department role: ${esc(r)}</p><button data-page="${p}">Open ${esc(r)} →</button></div><div class="card"><h3>Shared hospital status</h3><p>Available beds: <b>${availableBeds()}</b> / ${db.beds.total}</p><p>Delayed lab tests: <b>${delayedLabs()}</b></p><p>Pending discharges: <b>${pendingDischarges()}</b></p><p>Staff shortages: <b>${shortages()}</b></p><p class="muted smalltext">All signed-in roles can view shared operational information.</p></div></div><div class="card" style="margin-top:16px"><h3>Reports submitted by your department</h3>${table(["Report ID","Issue","Priority","Submitted","Status"],db.reports.filter(x=>x.department===r).map(x=>`<tr><td>${esc(x.id)}</td><td>${esc(x.issue)}</td><td>${statusTag(x.priority)}</td><td>${dt(x.time)}</td><td>${statusTag(x.status)}</td></tr>`))}</div><div class="card" style="margin-top:16px"><h3>Submit an operational report</h3>${reportForm(r)}</div>`}
function reportForm(dept=""){return `<form id="reportForm"><div class="grid two"><div class="field"><label>Department</label><select name="department" required>${ROLES.filter(r=>r!=="Medical Superintendent").map(r=>`<option ${r===dept?"selected":""}>${r}</option>`).join("")}</select></div><div class="field"><label>Priority</label><select name="priority"><option>Low</option><option>Medium</option><option selected>High</option><option>Critical</option></select></div></div><div class="field"><label>Issue / report title</label><input name="issue" required maxlength="140" placeholder="Describe the operational issue"></div><div class="field"><label>Details</label><textarea name="details" required maxlength="1200" placeholder="Add supporting information and context"></textarea></div><button>Submit report</button></form>`}
function bedInvestigationPanel(){
 const d1=db.discharges.find(d=>d.id==="DIS-301"),d2=db.discharges.find(d=>d.id==="DIS-302"),d3=db.discharges.find(d=>d.id==="DIS-303");
 const rows=[
  {bed:"B-104",patient:d1?.patient||"Not recorded",discharge:d1,root:d1&&d1.documents==="Pending"?"Discharge documentation pending":"Recheck discharge documentation",evidence:d1?`DIS-301: medical ${d1.medical}; documents ${d1.documents}; pharmacy ${d1.pharmacy}; billing ${d1.billing}; final approval ${d1.approval}. Notes: ${d1.notes||"none"}.`:"No linked discharge record found.",action:"Ask Discharge Coordination to verify and complete the paperwork checklist."},
  {bed:"B-108",patient:d2?.patient||"Not recorded",discharge:d2,root:d2&&/Awaiting|Not cleared/i.test(d2.medical)?"Clinical review pending":"Verify clinical review status",evidence:d2?`DIS-302: medical ${d2.medical}; documents ${d2.documents}; pharmacy ${d2.pharmacy}; billing ${d2.billing}; final approval ${d2.approval}. Notes: ${d2.notes||"none"}.`:"No linked discharge record found.",action:"Escalate to the responsible clinical team; do not discharge until clinician confirms."},
  {bed:"B-112",patient:d3?.patient||"Not recorded",discharge:d3,root:"Bed-level cause unconfirmed — verify readiness",evidence:d3?`DIS-303 currently records medical ${d3.medical}, documents ${d3.documents}, pharmacy ${d3.pharmacy}, billing ${d3.billing}, and approval ${d3.approval}. This does not prove the physical bed is ready or that this patient is linked to B-112.`:"No linked discharge record found.",action:"Ask the ward and Bed Management teams to verify the physical bed, cleaning, equipment, and clearance status."}
 ];
 const trs=rows.map(r=>`<tr><td><b>${esc(r.bed)}</b><div class="muted smalltext">Illustrative demo ID</div></td><td>${esc(r.patient)}<div class="muted smalltext">${esc(r.discharge?.id||"No discharge link")}</div></td><td>${esc(r.root)}<div style="margin-top:5px">${statusTag(r.bed==="B-112"?"Needs verification":r.bed==="B-108"&&r.discharge&&/Awaiting|Not cleared/i.test(r.discharge.medical)?"Pending":"Review needed")}</div></td><td>${esc(r.evidence)}</td><td>${esc(r.action)}<div style="margin-top:8px"><button class="small" data-createbedtask="${esc(r.bed)}">Create follow-up task</button></div></td></tr>`);
 return `<div class="card" id="bedInvestigation" style="margin-top:16px;border-top:4px solid #0f9f9a"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><h3 style="margin:0">AI Bed Blockage Investigation</h3><span class="tag amber">${db.beds.blocked} blocked beds reported</span></div><p class="muted smalltext" style="margin:8px 0 12px">Investigation report generated from the current demo discharge records. The three bed IDs and bed-to-patient links below are illustrative examples, not recorded physical-bed assignments. Confirm the actual bed, patient association, and timestamps with Bed Management before acting.</p><div class="notice warn"><b>Root-cause confidence:</b> A pending status is evidence of a workflow bottleneck, not proof that it caused a specific bed to be blocked. This prototype has no bed-level blockage start time, maintenance record, cleaning timestamp, or verified bed-patient link.</div><div class="table-wrap"><table><thead><tr><th>Bed</th><th>Patient / record</th><th>Possible root cause</th><th>Evidence from current records</th><th>Recommended action</th></tr></thead><tbody>${trs.join("")}</tbody></table></div><p class="muted smalltext" style="margin-top:10px">Snapshot time: ${dt(now())}. Exact blockage duration and per-bed event times are not available in the current data schema.</p></div>`;
}
function bedsPage(){let b=db.beds,edit=canEdit("Bed Management"),emergencyBeds=25,unavailableBeds=Math.max(0,b.total-b.occupied-emergencyBeds);return `${pageTitle("Bed Management","Monitor capacity, emergency-room capacity, cleaning, and waiting patients.")}<div class="grid four">${metric("Total beds",b.total,"▤")}${metric("Occupied",b.occupied,"▰")}${metric("Emergency beds",emergencyBeds,"🚑","Reserved emergency capacity")}</div><div class="grid two" style="margin-top:16px"><div class="card"><h3>Bed status distribution</h3><p>Occupied <b>${Math.round(b.occupied/Math.max(1,b.total)*100)}%</b></p><div class="progress"><span style="width:${Math.min(100,b.occupied/Math.max(1,b.total)*100)}%"></span></div><p style="margin-top:14px">Emergency room capacity <b>25</b> · Cleaning <b>${b.cleaning}</b> · Awaiting clearance <b>${b.clearance}</b></p><p class="muted smalltext">Emergency room capacity is set to 25 beds for this dashboard demo. Confirm actual capacity with authorised Bed Management staff.</p></div><div class="card"><h3>Operational context</h3><p>Patients waiting: <b>${b.waiting}</b></p><p>Emergency cases waiting: <b>${b.emergency}</b></p><p>Ward / unit: <b>${esc(b.ward)}</b></p><p>Blockage reason: ${esc(b.reason)}</p></div></div>${bedInvestigationPanel()}${emergencyRoomPanel(edit)}<div class="card" style="margin-top:16px"><h3>Ward-wise bed management</h3><p class="muted smalltext">Separate counts for each ward. These are fictional demonstration values; confirm physical bed status with ward staff.</p>${table(["Ward / unit","Total","Occupied","Blocked","Cleaning"],db.wards.map((w)=>`<tr><td><b>${esc(w.name)}</b></td><td>${w.total}</td><td>${w.occupied}</td><td>${w.blocked}</td><td>${w.cleaning}</td></tr>`))}${edit?`<form id="wardBedsForm" style="margin-top:14px"><div class="grid two">${db.wards.map((w,i)=>`<div class="card" style="box-shadow:none;background:#f8fbfd"><b>${esc(w.name)}</b><input type="hidden" name="wardName_${i}" value="${esc(w.name)}"><div class="grid two" style="margin-top:9px"><div class="field"><label>Total</label><input type="number" min="0" step="1" name="total_${i}" value="${w.total}" required></div><div class="field"><label>Occupied</label><input type="number" min="0" step="1" name="occupied_${i}" value="${w.occupied}" required></div><div class="field"><label>Blocked</label><input type="number" min="0" step="1" name="blocked_${i}" value="${w.blocked}" required></div><div class="field"><label>Cleaning</label><input type="number" min="0" step="1" name="cleaning_${i}" value="${w.cleaning}" required></div></div></div>`).join("")}</div><button>Save ward bed counts</button></form>`:`<p class="muted smalltext">Sign in with Bed Management or Superintendent access to edit ward counts.</p>`}</div>${edit?`<div class="card form-card" style="margin-top:16px"><h3>Update hospital-wide bed information</h3><form id="bedForm"><div class="grid three">${field("Total hospital beds","total",b.total,"number")}${field("Occupied beds","occupied",b.occupied,"number")}${field("Blocked beds","blocked",b.blocked,"number")}${field("Beds awaiting cleaning","cleaning",b.cleaning,"number")}${field("Awaiting discharge clearance","clearance",b.clearance,"number")}${field("Patients waiting","waiting",b.waiting,"number")}${field("Emergency cases waiting","emergency",b.emergency,"number")}${field("Ward or unit","ward",b.ward,"text")}</div><div class="field"><label>Reason for bed blockage</label><textarea name="reason" maxlength="600">${esc(b.reason)}</textarea></div><button>Save bed status</button></form></div>`:`<div class="role-note" style="margin-top:16px">Read-only for your role. Sign in as Bed Management to edit these values.</div>`}`}
function field(label,name,value,type="text",opts=null){if(opts)return `<div class="field"><label>${label}</label><select name="${name}">${opts.map(o=>`<option ${o===value?"selected":""}>${esc(o)}</option>`).join("")}</select></div>`;return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" ${type==="number"?'min="0" step="1"':''} required></div>`}
function doctorWorkload(d){return Math.max(0,Number(d.bookedToday)||0)}
function workloadPct(d){return Math.round(doctorWorkload(d)/Math.max(1,Number(d.capacity)||1)*100)}
function workloadBalancePanel(){const departments=[...new Set(db.doctors.map(d=>d.department).filter(Boolean))];return `<div class="card" style="margin-top:16px"><h3>Smart doctor workload balancer</h3><p class="muted smalltext">Routine and follow-up bookings are directed to the suitable available doctor with the lowest booked-to-capacity ratio. Clinical suitability, availability, and remaining slots still matter.</p><div class="grid three">${departments.map(dep=>{const ds=db.doctors.filter(d=>d.department===dep);const loads=ds.map(doctorWorkload);const total=loads.reduce((a,b)=>a+b,0);const eligible=ds.filter(d=>d.status==="Available"&&n(d.slots)>0&&doctorWorkload(d)<n(d.capacity));const sorted=[...eligible].sort((a,b)=>workloadPct(a)-workloadPct(b)||doctorWorkload(a)-doctorWorkload(b));return `<div class="notice"><b>${esc(dep)}</b><p class="smalltext">${total} booked today across ${ds.length} doctor(s)</p>${ds.map(d=>`<div style="margin:8px 0"><div style="display:flex;justify-content:space-between;gap:8px"><span>${esc(d.name)}</span><b>${doctorWorkload(d)}/${n(d.capacity)}</b></div><div class="progress"><span style="width:${Math.min(100,workloadPct(d))}%"></span></div><div class="muted smalltext">${workloadPct(d)}% of entered daily capacity · ${d.status==="Available"?n(d.slots):0} slot(s) left</div></div>`).join("")}<p class="smalltext"><b>Next suggested:</b> ${sorted[0]?esc(sorted[0].name):"No eligible doctor"}</p></div>`}).join("")}</div><p class="muted smalltext">Demo counts only: update booked-today counts and slots with verified scheduling data in a real deployment. This tool must not reassign an already confirmed appointment without patient notification and staff approval.</p></div>`}

function buildAgentPlan(){
 const b=db.beds;
 const docsPending=db.discharges.filter(d=>d.documents==="Pending");
 const approvalPending=db.discharges.filter(d=>d.approval!=="Approved");
 const clearedDocsPending=docsPending.filter(d=>d.medical==="Cleared by clinician");
 const delayed=delayedLabs();
 const waiting=n(b.waiting);
 const bedPressure=waiting>0 && regularAvailableBeds()<=Math.max(2,Math.ceil(waiting*.25));
 const causeParts=[];
 if(b.blocked>0)causeParts.push(`${b.blocked} beds are recorded as blocked`);
 if(docsPending.length)causeParts.push(`${docsPending.length} discharge case(s) have documents pending`);
 if(delayed>0)causeParts.push(`${delayed} laboratory report(s) are delayed`);
 const rootCause=causeParts.length?causeParts.join('; ')+'. These are correlated operational blockers; case-level dependencies must be confirmed by the responsible teams.': 'Current data does not identify a clear discharge/lab bottleneck; verify the source records.';
 const awaitingClin=db.discharges.filter(d=>/Awaiting|Not cleared/i.test(d.medical)),labsDel=db.labs.filter(l=>n(l.delayed)>0),edv=db.ed||{waitMin:0,boarding:0};
 const bedsA=clearedDocsPending.length,hoursA=bedsA?Math.max(...clearedDocsPending.map(d=>parseHours(d.release))):0;
 const bedsB=Math.min(delayed,awaitingClin.length),hoursB=bedsB&&labsDel.length?Math.max(...labsDel.map(l=>parseHours(l.expected)))+0.5:0;
 const options=[
  {id:'A',title:'Expedite paperwork',beds:bedsA,hours:hoursA,condition:`${clearedDocsPending.length} case(s) show clinician clearance and pending documents; verify pharmacy, billing and all required approvals.`,action:'Ask Discharge Coordination to review the specific document checklist for clinician-cleared cases.',formula:`Beds = ${bedsA} clinician-cleared case(s) with documents pending (1 bed each, capped at ${b.blocked} blocked beds). Time = longest recorded release estimate among them (${fmtH(hoursA)}).`},
  {id:'B',title:'Escalate delayed labs',beds:bedsB,hours:hoursB,condition:`${delayed} delayed lab report(s) are recorded. Only count a bed as released if the responsible clinician confirms the result is needed and the discharge can safely proceed.`,action:'Ask the lab lead to prioritise and report status for the delayed results linked to discharge cases.',formula:`Beds = min(${delayed} delayed report(s), ${awaitingClin.length} case(s) awaiting clinical review) = ${bedsB}. Time = longest expected lab turnaround (${labsDel.length?fmtH(Math.max(...labsDel.map(l=>parseHours(l.expected)))):'n/a'}) + 0.5h clinician review.`},

 ];
 options.forEach(o=>{o.beds=Math.min(o.beds,Math.max(0,b.blocked));o.hours=Math.round(o.hours*10)/10;o.edDrop=o.beds>0?Math.round(n(edv.waitMin)*Math.min(1,o.beds/Math.max(1,n(edv.boarding)+n(b.emergency)))*0.5):0});
 const M=db.money||{bedDay:6000,admission:28000};
 const effortOf={A:hoursA,B:hoursB,C:hoursA+hoursB};
 options.forEach(o=>{
  o.effort=Math.round((effortOf[o.id]||0)*10)/10;
  o.capValue=o.beds*M.bedDay;
  o.admits=Math.min(o.beds,waiting);
  o.revenue=o.admits*M.admission;
  o.perHour=o.effort>0?Math.round(o.revenue/o.effort):0;

 });

 const recommended=[...options].sort((x,y)=>y.perHour-x.perHour||y.beds-x.beds||x.hours-y.hours)[0].id;
 const maxBeds=options.find(o=>o.id===recommended)?.beds||0;
 return {b,docsPending,approvalPending,clearedDocsPending,delayed,waiting,bedPressure,rootCause,options,recommended,maxBeds,money};

function impParseCSV(text){
 text=text.replace(/^\uFEFF/,"");
 const first=text.split(/\r?\n/).find(l=>l.trim())||"";
 const cand=[",",";","\t","|"];let delim=cand.map(d=>[d,first.split(d).length]).sort((a,b)=>b[1]-a[1])[0][0];
 const rows=[];let row=[],cur="",q=false;
 for(let i=0;i<text.length;i++){const c=text[i];
  if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
  else if(c==='"')q=true;
  else if(c===delim){row.push(cur);cur=""}
  else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(cur);cur="";if(row.some(x=>x.trim()!==""))rows.push(row);row=[]}
  else cur+=c}
 row.push(cur);if(row.some(x=>x.trim()!==""))rows.push(row);
 if(rows.length<2)return [];
 const heads=rows[0].map((h,i)=>String(h).trim()||("Column "+(i+1)));
 return rows.slice(1).map(r=>{const o={};heads.forEach((h,i)=>o[h]=(r[i]??"").trim());return o});
}
function impFromJSON(txt){
 const j=JSON.parse(txt),sheets=[];
 if(Array.isArray(j))sheets.push({name:"data",rows:j.filter(x=>x&&typeof x==="object")});
 else if(j&&typeof j==="object"){Object.keys(j).forEach(k=>{if(Array.isArray(j[k])&&j[k].length&&typeof j[k][0]==="object")sheets.push({name:k,rows:j[k]})})}
 sheets.forEach(s=>s.rows=s.rows.map(r=>{const o={};Object.keys(r).forEach(k=>o[k]=typeof r[k]==="object"&&r[k]!==null?JSON.stringify(r[k]):r[k]);return o}));
 return sheets;
}

async function impReadFile(file){
 const ext=(file.name.split(".").pop()||"").toLowerCase();
 if(ext==="xlsx"||ext==="xls"){await impLoadXLSX();const wb=XLSX.read(await file.arrayBuffer(),{type:"array",cellDates:true});
  return wb.SheetNames.map(nm=>({name:nm,rows:XLSX.utils.sheet_to_json(wb.Sheets[nm],{defval:"",raw:false})})).filter(s=>s.rows.length)}
 const text=await file.text();
 if(ext==="json"||/^\s*[\[{]/.test(text))return impFromJSON(text);
 return [{name:file.name.replace(/\.[^.]+$/,""),rows:impParseCSV(text)}];
}
/* ---- mapping ---- */
function impAutoMap(typeKey,headers){
 const map={},used=new Set();const fields=IMP_TYPES[typeKey].fields;
 const nh=headers.map(h=>[h,impNorm(h)]);
 fields.forEach(f=>{for(const a of f.al){const hit=nh.find(([h,n])=>n===a&&!used.has(h));if(hit){map[f.k]=hit[0];used.add(hit[0]);break}}});
 fields.forEach(f=>{if(map[f.k])return;for(const a of f.al){if(a.length<4)continue;const hit=nh.find(([h,n])=>!used.has(h)&&(n.includes(a)||(n.length>=4&&a.includes(n))));if(hit){map[f.k]=hit[0];used.add(hit[0]);break}}});
 return map;
}
function impDetect(headers){
 let best=null,bestScore=-1;
 Object.keys(IMP_TYPES).forEach(t=>{const m=impAutoMap(t,headers);const fields=IMP_TYPES[t].fields;
  const reqOk=fields.filter(f=>f.req).every(f=>m[f.k]);const score=Object.keys(m).length+(reqOk?3:-3);
  if(score>bestScore){bestScore=score;best=t}});
 return best;
}
/* ---- transform ---- */
function impBedClass(st){st=String(st||"").toLowerCase();
 if(/block|out of service|maint|unavail|closed|isolat/.test(st))return"blocked";
 if(/clean|housekeep|turnover|sanit/.test(st))return"cleaning";
 if(/clearance|awaiting|pending|discharge/.test(st))return"clearance";
 if(/occup|in use|inuse|admit|taken|full|busy/.test(st))return"occupied";
 if(/avail|vacant|free|empty|open|ready|clean and/.test(st))return"available";
 return"unknown"}
function impBuild(typeKey,rows,map){
 const T=IMP_TYPES[typeKey],get=(r,k)=>map[k]?r[map[k]]:undefined,skipped=[];
 const nonEmpty=rows.filter(r=>Object.values(r).some(v=>String(v??"").trim()!==""));
 if(typeKey==="beds_records"){
  const w={},reasons={};let unknown=0;
  nonEmpty.forEach(r=>{const st=get(r,"status");if(st===undefined||String(st).trim()===""){skipped.push("blank status");return}
   const name=String(get(r,"ward")||"General Ward").trim()||"General Ward";w[name]??={name,total:0,occupied:0,blocked:0,cleaning:0,clearance:0};
   const c=impBedClass(st);const o=w[name];o.total++;
   if(c==="unknown"){unknown++;return}
   if(c==="occupied")o.occupied++;else if(c==="blocked"){o.blocked++;const rs=String(get(r,"reason")||"").trim();if(rs){reasons[rs]=(reasons[rs]||0)+1}}
   else if(c==="cleaning")o.cleaning++;else if(c==="clearance")o.clearance++});
  return{kind:"beds",wards:Object.values(w),reasons,unknown,skipped,count:Object.values(w).reduce((s,x)=>s+x.total,0)}}
 if(typeKey==="wards"){
  const wards=[];nonEmpty.forEach(r=>{const name=String(get(r,"name")||"").trim();if(!name){skipped.push("no ward name");return}
   const total=impNum(get(r,"total"));if(!total){skipped.push(name+": no total");return}
   const occ=Math.min(total,impNum(get(r,"occupied"))),blk=Math.min(total-occ,impNum(get(r,"blocked"))),cl=Math.min(total-occ-blk,impNum(get(r,"cleaning")));
   wards.push({name,total,occupied:occ,blocked:blk,cleaning:cl,clearance:0})});
  return{kind:"beds",wards,reasons:{},unknown:0,skipped,count:wards.reduce((s,x)=>s+x.total,0)}}
 const out=[];
 nonEmpty.forEach((r,i)=>{const o={};
  T.fields.forEach(f=>{let v=get(r,f.k);if(f.num)o[f.k]=impNum(v);else o[f.k]=v===undefined||v===null?"":String(v).trim()});
  const req=T.fields.find(f=>f.req&&(f.num?false:!o[f.k]));if(req){skipped.push("row "+(i+2)+": missing "+req.label);return}
  if(!o.id)o.id=id(T.pre);
  if(typeKey==="doctors"){o.hospital="Main Hospital";o.department=o.department||o.specialty||"General Medicine";o.specialty=o.specialty||o.department;
   o.status=/unavail|off|leave|absent|busy|surgery/i.test(o.status)?"Unavailable":"Available";
   if(!o.capacity)o.capacity=20;if(!map.bookedToday)o.bookedToday=o.waiting;if(!map.slots)o.slots=o.status==="Available"?Math.max(0,o.capacity-o.bookedToday):0;
   if(o.status!=="Available")o.slots=0;o.next=o.next||(o.status==="Available"?"Next available":"Tomorrow");o.noShows=0}
  if(typeKey==="labs"){o.priority=impPri(o.priority||"Medium");o.status=/delay/i.test(o.status)||(!o.status&&o.delayed>0)?"Delayed":/complete|done|closed/i.test(o.status)?"Completed":"In Progress";
   o.delayed=Math.min(o.delayed,o.pending||o.delayed);o.expected=o.expected||"1 hour";o.requesting=o.requesting||"General Medicine";o.created=now()}
  if(typeKey==="discharges"){const done=s=>/clear|complete|done|approv|yes|paid|ok/i.test(s);
   o.medical=!o.medical?"Awaiting clinical review":/clear|approv|yes|fit|ok/i.test(o.medical)&&!/await|pending|not/i.test(o.medical)?"Cleared by clinician":"Awaiting clinical review";
   o.documents=done(o.documents)&&!/pend|incomplete|await/i.test(o.documents)?"Complete":"Pending";
   o.pharmacy=done(o.pharmacy)&&!/pend|await/i.test(o.pharmacy)?"Cleared":"Pending";
   o.billing=done(o.billing)&&!/pend|await|due/i.test(o.billing)?"Cleared":"Pending";
   o.approval=/approv|yes|done|complete/i.test(o.approval)&&!/pend|await|not/i.test(o.approval)?"Approved":"Pending";
   if(o.medical!=="Cleared by clinician")o.approval="Pending";o.release=o.release||"2 hours";o.coordinator=o.coordinator||"Unassigned";o.created=now()}
  if(typeKey==="staff"){if(!map.shortage)o.shortage=Math.max(0,o.required-o.available);o.shift=o.shift||"Day";o.uncovered=o.uncovered||(o.shortage?o.shortage+" position(s)":"None");
   o.workload=o.workload||(o.shortage>=4?"High":o.shortage>0?"Medium":"Normal")}
  if(typeKey==="complaints"){o.priority=impPri(o.priority);o.status=/resol|clos|done/i.test(o.status)?"Resolved":/progress|ongoing|working/i.test(o.status)?"In Progress":"Open";
   o.category=o.category||"General";o.department=o.department||"Patient Services";o.date=o.date||now()}
  if(typeKey==="transfers"){o.priority=impPri(o.priority);o.status=o.status||"Awaiting Receiving Hospital Confirmation";o.created=now()}
  out.push(o)});
 return{kind:"list",key:IMP_DB_KEY[typeKey],rows:out,skipped,count:out.length}
}
function impApply(typeKey,built,mode,fileName){
 if(!localStorage.getItem(IMP_BACKUP_KEY)){try{localStorage.setItem(IMP_BACKUP_KEY,JSON.stringify(db))}catch(e){}}
 let label;
 if(built.kind==="beds"){
  const W=built.wards;if(!W.length)throw new Error("No usable ward/bed rows found.");
  const merged=mode==="append"?[...(db.wards||[]).filter(x=>!W.some(w=>w.name===x.name)),...W]:W;
  db.wards=merged.map(w=>({name:w.name,total:w.total,occupied:w.occupied,blocked:w.blocked,cleaning:w.cleaning}));
  const b=db.beds,S=k=>merged.reduce((s,w)=>s+(w[k]||0),0);
  b.total=S("total");b.occupied=S("occupied");b.blocked=S("blocked");b.cleaning=S("cleaning");
  b.clearance=mode==="append"?b.clearance:S("clearance");b.emergency=Math.min(b.emergency||0,b.waiting||0);clampBeds();
  const topWard=[...merged].sort((a,b2)=>b2.blocked-a.blocked)[0];if(topWard&&topWard.blocked)b.ward=topWard.name;
  const topReason=Object.entries(built.reasons).sort((a,b2)=>b2[1]-a[1])[0];if(topReason)b.reason=topReason[0];
  label=`${b.total} beds across ${merged.length} wards (${b.blocked} blocked)`;
 }else{
  if(!built.rows.length)throw new Error("No usable rows found.");
  const k=built.key;db[k]=mode==="append"?[...(db[k]||[]),...built.rows]:built.rows;
  label=`${built.rows.length} ${IMP_TYPES[typeKey].label.toLowerCase()} record(s)`;
 }
 db.scenarioSnap=null;
 logEvent(`Dataset imported from "${fileName}": ${label}`,"System","Low");
 try{db.monitor.known=null}catch(e){}
 try{runAgentCycle("Dataset imported")}catch(e){}
 save();render();
 toast("Imported "+label+".");
 return label;
}

 }
 else if(IMP.step===2){
  const S=IMP.sheets[IMP.sheet],headers=Object.keys(S.rows[0]||{}),T=IMP_TYPES[IMP.type];

function impHandleText(text,name){
